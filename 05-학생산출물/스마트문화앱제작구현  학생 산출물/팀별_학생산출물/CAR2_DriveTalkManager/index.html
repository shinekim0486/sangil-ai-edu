<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR2 Drive Talk Manager</title><style>
:root{--p:#0f8c82;--bg:#effaf8;--ink:#153a39;--line:#cce7e3;--bad:#c43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}header{padding:22px 5%;background:#0c423f;color:white}main{max-width:1050px;margin:25px auto;padding:0 16px}.tools{display:flex;gap:10px}.tools input{flex:1;padding:13px;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:11px;background:var(--p);color:#fff;padding:12px 15px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.stat b{display:block;font-size:25px}.layout{display:grid;grid-template-columns:340px 1fr;gap:15px}.item{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:15px;text-align:left}.item.active{background:#dff6f2}.id{font-size:11px;color:#6c8b88}.messages{min-height:360px}.bubble{max-width:76%;padding:13px;margin:10px 0;border-radius:14px;background:#eef3f3}.mine{margin-left:auto;background:#dff6f2}.notice{padding:11px;background:#fff5d8;border-radius:10px;color:#765700}.bad{color:var(--bad)}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.messages{min-height:260px}}
</style></head><body><header><h2>CAR2 · Drive Talk Manager</h2><p>목록과 메시지 중복을 분리해 확인하는 대화 관리 앱</p></header><main><div class="tools"><input id="search" placeholder="제작 구간 또는 대화 제목 검색"><button id="fast" class="btn">빠른 갱신 시험</button></div><div class="stats"><div class="stat"><span>대화 항목</span><b id="count">3</b></div><div class="stat"><span>중복 제거</span><b>ON</b></div><div class="stat"><span>선택 ID</span><b id="selected">C2-102</b></div></div><div class="layout"><aside class="card" id="list"><button class="item active" data-id="C2-102"><b>코너 주행 · 우회전 떨림</b><div class="id">C2-102 · 최근 14:32</div></button><button class="item" data-id="C2-091"><b>차체 조립 · 좌측 바퀴</b><div class="id">C2-091 · 최근 13:10</div></button><button class="item" data-id="C2-074"><b>센서 연결 · 초음파 값</b><div class="id">C2-074 · 어제</div></button></aside><section class="card messages"><div class="notice" id="notice">현재 선택한 대화 ID를 기준으로 화면을 갱신합니다.</div><div class="bubble mine">우회전할 때 차량이 떨려요.</div><div class="bubble">조향각과 좌우 모터 속도를 함께 알려 주세요.</div><div class="bubble mine">조향각 18°, 좌 42, 우 30입니다.</div></section></div></main><script>
document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected.textContent=b.dataset.id;notice.textContent=`${b.dataset.id} 응답만 표시했습니다. 이전 요청의 늦은 응답은 섞지 않습니다.`});search.oninput=()=>document.querySelectorAll('.item').forEach(b=>b.hidden=!b.innerText.includes(search.value));fast.onclick=()=>{fast.disabled=true;notice.textContent='목록 갱신 중… 중복 클릭을 차단했습니다.';setTimeout(()=>{notice.textContent='갱신 완료: 같은 ID 항목 1건을 제거했습니다.';fast.disabled=false},900)}
</script></body></html>
