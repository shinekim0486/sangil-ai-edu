<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR1 Drive Question Lab</title><style>
:root{--p:#3458d4;--bg:#f4f6ff;--ink:#182142;--line:#d9e0f3;--ok:#16834b}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}header{padding:18px 6%;background:#162653;color:#fff;display:flex;justify-content:space-between;align-items:center}.team{background:#fff2b2;color:#6e5100;padding:8px 12px;border-radius:99px;font-weight:800}main{max-width:980px;margin:28px auto;padding:0 16px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{margin:.2em 0}.muted{color:#6c789b}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.step{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center}.step.on{background:#e5ebff;border-color:var(--p);color:var(--p);font-weight:800}.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 25px #263a7a12}.conversation button{width:100%;text-align:left;border:0;background:#f7f8fd;padding:13px;border-radius:11px;margin:5px 0}.conversation button.active{background:#e4ebff;color:#284cc7}.photo{height:220px;background:linear-gradient(#9ed2ef 40%,#6d8d65 40% 58%,#59606b 58%);border-radius:14px;display:grid;place-items:center;color:white;font-weight:900}.composer{display:flex;gap:8px;margin-top:14px}.composer input{flex:1;padding:13px;border:1px solid var(--line);border-radius:11px}.btn{border:0;background:var(--p);color:white;border-radius:11px;padding:12px 15px;font-weight:800}.btn:disabled{opacity:.45}.status{margin-top:12px;padding:12px;border-radius:10px;background:#e8f8ef;color:var(--ok)}@media(max-width:700px){.layout{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.conversation{order:2}.hero{display:block}}
</style></head><body><header><b>🚙 DRIVE QUESTION LAB</b><span class="team">현재 접속: CAR1</span></header><main><div class="hero"><div><span class="muted">차량 제작 질문 도우미</span><h1>전방 센서 조립 질문</h1></div><b>대화 ID #C1-023</b></div><div class="steps"><div class="step on">1 팀 확인</div><div class="step on">2 사진 선택</div><div class="step" id="s3">3 질문 전송</div><div class="step" id="s4">4 답변 확인</div></div><div class="layout"><aside class="card conversation"><b>지난 대화</b><button class="active">전방 센서 조립 · 오늘</button><button>코너 주행 튜닝 · 어제</button><button>배터리 연결 점검 · 10/28</button><p class="muted">팀과 대화 제목을 먼저 확인한 뒤 질문하세요.</p></aside><section class="card"><div class="photo">선택한 사진: 전방센서_조립.jpg</div><p><b>사진 선택 완료</b><br><span class="muted">2.4 MB · JPG · 전송 전</span></p><div class="composer"><button class="btn" style="background:#edf1ff;color:#3458d4">＋ 첨부</button><input id="q" value="센서 방향이 맞는지 확인해 주세요" aria-label="질문"><button id="send" class="btn">보내기</button></div><div id="msg" class="status">현재 상태: 질문을 전송할 수 있습니다.</div></section></div></main><script>send.onclick=()=>{send.disabled=true;s3.classList.add('on');msg.textContent='전송 중입니다. 같은 질문을 다시 보내지 마세요.';setTimeout(()=>{s4.classList.add('on');msg.textContent='답변이 도착했습니다. 센서 화살표가 앞쪽을 향하는지 확인하세요.';send.disabled=false},1100)}</script></body></html>
