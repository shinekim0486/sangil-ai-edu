<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR5 Drive Coach</title><style>
:root{--p:#1970c8;--bg:#eef6ff;--ink:#142f4d;--line:#cfe1f3;--ask:#8b5cf6;--wait:#1970c8;--bad:#d23b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}header{padding:20px 5%;background:#123a64;color:white}main{max-width:980px;margin:24px auto;padding:0 15px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px}.layout{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-top:14px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px}.task{padding:12px;border-radius:11px;background:#f3f7fb;margin:8px 0}.task.active{background:#dcecff}.state{padding:14px;border-radius:13px;margin:11px 0}.ask{background:#f0e9ff;color:#633ab0}.wait{background:#e1efff;color:#11579e}.error{background:#fee6e6;color:#a92525}.next{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:0;background:var(--p);color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.compare div{background:#f7f9fc;padding:12px;border-radius:11px}@media(max-width:700px){.layout{grid-template-columns:1fr}.compare{grid-template-columns:1fr}}</style></head><body><header><h2>CAR5 · Drive Coach</h2><p>챗봇 상태와 학생의 다음 행동을 연결하는 학습 앱</p></header><main><input id="search" class="search" placeholder="차체 조립, 코너 주행 등 대화 검색"><div class="layout"><aside class="card" id="tasks"><div class="task active">코너 주행 · 진입 시점</div><div class="task">차체 조립 · 센서 방향</div><div class="task">카메라 · 차선 인식</div></aside><section class="card"><h3>현재 대화 상태</h3><div class="state ask"><b>추가 조건을 묻는 답변</b><p>현재 조향각과 좌우 모터 속도를 알려 주세요.</p><div class="next"><span>다음 행동: 조건을 보충해 답변하기</span><button class="btn" onclick="statusBox.className='state wait';statusBox.innerHTML='<b>답변 처리 중</b><p>조건을 분석하고 있습니다. 보내기 버튼은 잠시 사용할 수 없습니다.</p>'">조건 입력</button></div></div><div id="statusBox" class="state error"><b>요청 실패 예시</b><p>서버에 연결하지 못했습니다. 입력 내용은 보존했습니다.</p><div class="next"><span>다음 행동: 연결 확인 후 재시도</span><button class="btn">다시 시도</button></div></div><div class="compare"><div><b>수정 전</b><p>말풍선 색만 달라 다음 행동이 불분명함</p></div><div><b>수정 후</b><p>상태 문구와 다음 행동 버튼을 함께 표시</p></div></div></section></div></main><script>search.oninput=()=>document.querySelectorAll('.task').forEach(x=>x.hidden=!x.innerText.includes(search.value));document.querySelectorAll('.task').forEach(x=>x.onclick=()=>{document.querySelectorAll('.task').forEach(y=>y.classList.remove('active'));x.classList.add('active')})</script></body></html>
