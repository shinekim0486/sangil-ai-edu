<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR3 Photo Retry Studio</title><style>
:root{--p:#e0632b;--bg:#fff7f2;--ink:#432418;--line:#efd7cc;--ok:#18794e;--bad:#c43b38}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}header{padding:22px 5%;background:#6e2f19;color:white}main{max-width:850px;margin:26px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px}.drop{border:2px dashed #e5a181;padding:30px;text-align:center;border-radius:15px}.btn{border:0;border-radius:11px;background:var(--p);color:#fff;padding:12px 16px;font-weight:800}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.check{padding:13px;background:#f8fafc;border-radius:11px}.ok{color:var(--ok)}.bad{color:var(--bad)}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit}.error{background:#fee8e6;color:var(--bad);padding:14px;border-radius:12px}.actions{display:flex;gap:9px;margin-top:12px}@media(max-width:620px){.checks{grid-template-columns:1fr}.actions{position:sticky;bottom:8px;background:#fff;padding:8px;flex-wrap:wrap}.actions .btn{flex:1}}</style></head><body><header><h2>CAR3 · Photo Retry Studio</h2><p>파일 조건 오류와 통신 오류를 구별하는 첨부 복구 앱</p></header><main><section class="card"><h3>1. 질문 작성</h3><textarea id="text">전방 센서가 오른쪽으로 기울어 보입니다. 조립 방향을 확인해 주세요.</textarea></section><section class="card"><h3>2. 파일 사전 점검</h3><div class="drop"><b>전방센서_조립사진_최종본.jpg</b><p>4.8 MB · JPG · 2400×1800</p><button id="check" class="btn">파일 조건 확인</button></div><div class="checks"><div class="check">형식<br><b class="ok">JPG 지원</b></div><div class="check">크기<br><b class="ok">10 MB 이하</b></div><div class="check">파일명<br><b class="ok">한글 표시 정상</b></div></div></section><section class="card"><h3>3. 전송 상태</h3><div id="result" class="error"><b>첨부 전송 실패</b><br>질문 내용은 보존했습니다. 네트워크 연결을 확인한 뒤 사진만 다시 전송할 수 있습니다.</div><div class="actions"><button id="retry" class="btn">사진만 다시 시도</button><button class="btn" style="background:#eee;color:#6e2f19" onclick="result.textContent='파일 선택 단계로 돌아갔습니다. 질문 내용은 그대로 유지됩니다.'">다른 파일 선택</button></div></section></main><script>check.onclick=()=>{result.className='';result.textContent='파일 조건은 정상입니다. 아직 서버 전송은 시작하지 않았습니다.'};retry.onclick=()=>{retry.disabled=true;result.className='';result.textContent='사진을 다시 전송하는 중입니다…';setTimeout(()=>{result.textContent='사진 전송 완료. 보존된 질문과 함께 답변을 요청할 수 있습니다.';retry.disabled=false},1000)}</script></body></html>
