const DATA=JSON.parse(document.getElementById('source-data').textContent);
const KEY='openlesson-observation-2026-v1';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=['미기록','관찰됨','일부','안 됨'];
function periods(r){const values=[...new Set(r.info['참관 차시'].match(/\d+차시/g)||[])];return values.reduce((all,p)=>all.concat([p],all.map(x=>x.replace(/차시$/,'')+'·'+p)),[]);}
let edits=JSON.parse(document.getElementById('default-edits').textContent),dirty=false,currentId=null,saveWarning='';
function validate(value){
 if(!value||typeof value!=='object'||Array.isArray(value))throw Error('수정 데이터 형식 오류');
 const safe={};
 for(const [id,v] of Object.entries(value)){
  const r=DATA.records.find(x=>x.id===id);if(!r)throw Error('현재 원본과 일치하지 않는 참관록입니다.');
  if(!v||typeof v!=='object'||Array.isArray(v))throw Error('참관록 형식 오류');
  const clean={};
  for(const k of ['strengths','improvements','application','scene','date','period','signature','updatedAt']){
   if(v[k]!==undefined){if(typeof v[k]!=='string'||v[k].length>50000)throw Error('텍스트 형식 오류');clean[k]=v[k];}
  }
  if(clean.date&&!/^\d{4}-\d{2}-\d{2}$/.test(clean.date))throw Error('날짜 형식 오류');
  if(clean.period&&!periods(r).includes(clean.period))throw Error('참관 차시 형식 오류');
  if(v.observations!==undefined){
   if(!Array.isArray(v.observations)||v.observations.length!==r.criteria.length)throw Error('관찰 항목 수 오류');
   clean.observations=v.observations.map(o=>{
    if(!o||!opts.includes(o.result)||typeof o.evidence!=='string'||o.evidence.length>50000)throw Error('관찰 결과 형식 오류');
    return {result:o.result,evidence:o.evidence};
   });
  }
  safe[id]=clean;
 }
 return safe;
}
try{const stored=localStorage.getItem(KEY);if(stored){const parsed=validate(JSON.parse(stored));for(const [k,v] of Object.entries(parsed)){if(v&&v.date&&v.period&&v.signature)edits[k]=v;}}}catch(e){}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hide'),4200);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(edits));return true;}catch(e){toast('브라우저 저장 실패: JSON 백업으로 입력 내용을 보관하세요.');return false;}}
function complete(r){const v=edits[r.id];return !!(v&&v.date&&v.period&&v.signature?.trim()&&v.strengths?.trim()&&v.improvements?.trim()&&v.application?.trim()&&v.scene?.trim()&&v.observations?.length===r.criteria.length&&v.observations.every(o=>o.result!=='미기록'&&o.evidence.trim()));}
function state(r){return complete(r)?'입력 완료':edits[r.id]?'작성 중':'미작성';}
function group(s){return DATA.records.filter(r=>r.subject===s.name);}
function header(k,title,sub){return `<div class="eyebrow">${k}</div><h1>${title}</h1><p class="subtitle">${sub}</p>`;}
const warning='<div class="notice" style="background:#edf6f3;border-color:#b8dfd8;color:#145a50"><b>공개수업 참관 완료</b> &nbsp; 7개 교과 48건의 공개수업(2026. 10. 19.~10. 22.) 참관 결과·관찰 근거·참관일·서명 확인이 모두 반영되었습니다.</div>';
function metrics(){return `<div class="metrics"><div class="metric"><div class="metric-label">공개수업 교과</div><div class="metric-value">7<span>개 교과</span></div><div class="metric-note">전문교과 융합 수업</div></div><div class="metric"><div class="metric-label">개별 참관록</div><div class="metric-value">48<span>건</span></div><div class="metric-note">교과별 참관 연인원 48명</div></div><div class="metric"><div class="metric-label">참관교사</div><div class="metric-value">${new Set(DATA.records.map(r=>r.observer)).size}<span>명</span></div><div class="metric-note">교과 간 중복을 제외한 인원</div></div><div class="metric"><div class="metric-label">필수 항목 입력 완료</div><div class="metric-value">${DATA.records.filter(complete).length}<span>/ 48건</span></div><div class="metric-note">전 교과 참관 및 서명 확인 완료</div></div></div>`;}
const icons=['{ }','3D','↔','AI','⌘','APP','▶'];
function cards(list){return list.map(s=>{const rs=group(s),n=rs.filter(complete).length;return `<article class="card"><div class="cardtop"><div class="subjecticon">${icons[Number(s.id)]}</div><span class="pill">참관 완료 ${s.count}건</span></div><h3>${esc(s.name)}</h3><div class="cardmeta">수업자 &nbsp; <b>${esc(s.teacher)}</b><br>참관교사 &nbsp; ${s.count}명<br>${esc(rs[0].info['일시·학급']).replace(/\n/g,'<br>')}</div><div style="margin-top:auto"><div class="cardbottom"><span>입력 완료 ${n} / ${s.count}</span><a href="#subject=${s.id}">참관록 열기 →</a></div><div class="progress"><div style="width:${n/s.count*100}%"></div></div></div></article>`;}).join('')||'<div class="empty">검색 결과가 없습니다.</div>';}
function overview(){app.innerHTML=header('2026 상일미디어고등학교 AI 에이전트 교육혁신 연구회','수업의 장면을 기록하고,<br>함께 더 나은 수업으로.','교과별 공개수업 참관록과 참관교사 피드백을 한곳에서 관리합니다.')+metrics()+warning+`<div class="sectionhead"><h2>교과별 공개수업</h2><span class="muted small">2026. 10. 19.(월) — 10. 22.(목)</span></div><div class="grid">${cards(DATA.subjects)}</div><div class="panel"><h3>기록에서 수업 개선까지</h3><div class="tagrow"><span class="pill">01 교과·참관교사 선택</span><span class="pill">02 실제 관찰 근거 입력</span><span class="pill">03 피드백 종합·확인</span><span class="pill">04 인쇄·백업</span></div><p class="small muted">원본 ZIP/HWPX는 그대로 보존했습니다. 입력 내용은 현재 브라우저에만 저장됩니다. 정기적으로 JSON 백업을 내려받으세요.</p></div>`;}
function recordsPage(){app.innerHTML=header('OBSERVATION RECORDS','교과별 참관록','7개 교과 · 48건의 개별 참관록 | 교과를 선택해 참관교사별 기록을 작성하세요.')+`<div class="filters no-print"><input class="control search" id="search" aria-label="교과·교사 검색" placeholder="교과명, 수업자, 참관교사 검색"><select class="control" id="filter" aria-label="작성 상태"><option value="all">모든 작성 상태</option><option value="pending">입력 미완료 포함</option><option value="complete">입력 완료 포함</option></select></div><div class="grid" id="cards"></div>`;const update=()=>{const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value;document.getElementById('cards').innerHTML=cards(DATA.subjects.filter(s=>[s.name,s.teacher,...group(s).map(r=>r.observer)].some(v=>v.toLowerCase().includes(q))&&(f==='all'||group(s).some(r=>f==='complete'?complete(r):!complete(r)))));};document.getElementById('search').addEventListener('input',update);document.getElementById('filter').addEventListener('change',update);update();}
function draft(r,key){return `<details class="draftbox"><summary>원본 초안 보기 · ${esc(key)}</summary><div class="pre">${esc(r.opinions[key]||'원본 내용 없음')}</div></details>`;}
function field(label,key,value,placeholder){return `<label class="field">${label}<textarea class="control" data-field="${key}" placeholder="${placeholder}">${esc(value||'')}</textarea></label>`;}
function capture(){if(!currentId)return;const r=DATA.records.find(r=>r.id===currentId);if(!r||!document.getElementById('recordform'))return;const v={...(edits[currentId]||{})};app.querySelectorAll('[data-field]').forEach(el=>v[el.dataset.field]=el.value);v.observations=r.criteria.map((c,i)=>({result:document.getElementById('result'+i).value,evidence:document.getElementById('evidence'+i).value}));v.updatedAt=new Date().toISOString();edits[currentId]=v;}
function save(){capture();if(persist()){dirty=false;toast('이 브라우저에 저장했습니다. JSON 백업도 보관하세요.');const label=document.getElementById('savestatus');if(label)label.textContent='저장됨 · '+new Date().toLocaleString('ko-KR');}}
function subjectPage(id,observer){const s=DATA.subjects.find(s=>s.id===id);if(!s){location.hash='records';return;}const rs=group(s),r=rs.find(r=>r.observer===observer)||rs[0],v=edits[r.id]||{};currentId=r.id;
 app.innerHTML=header('INDIVIDUAL RECORD',esc(s.name),`수업자 ${esc(s.teacher)} · 개별 참관록 ${s.count}건 · <a href="#records">교과 목록</a>`)+warning+`<div class="recordhead"><label class="small no-print">참관교사 선택 &nbsp;<select id="observer" class="control">${rs.map(x=>`<option value="${esc(x.observer)}" ${x.id===r.id?'selected':''}>${esc(x.observer)} · ${state(x)}</option>`).join('')}</select></label><a class="btn no-print" href="교과별_참관록/${encodeURIComponent(s.name+'_참관록.html')}" target="_blank" rel="noopener">교과 전체 인쇄용 참관록 ↗</a></div><div id="recordform"><section class="panel"><div class="sectionhead" style="margin-top:0"><h2>${esc(r.observer)} 교사 참관록</h2><span class="pill">${state(r)}</span></div><div class="infogrid">${Object.entries(r.info).filter(([k])=>!['참관 차시','참관자'].includes(k)).map(([k,val])=>`<div class="info"><b>${esc(k)}</b><span class="pre">${esc(val)}</span></div>`).join('')}</div><div class="two" style="margin-top:20px"><label class="field">실제 참관일<input type="date" class="control" data-field="date" value="${esc(v.date||'')}"></label><label class="field">실제 참관 차시<select class="control" data-field="period"><option value="">선택하세요</option>${periods(r).map(p=>`<option ${v.period===p?'selected':''}>${p}</option>`).join('')}</select></label></div></section><section class="panel"><h2>01. 관찰 항목</h2><p class="muted small">실제로 본 장면을 선택하고 시각·팀 코드·근거 위치를 남기세요. 미기록은 관찰되지 않았다는 뜻이 아닙니다.</p><div class="tablewrap"><table><thead><tr><th style="width:45%">관찰 항목 / 확인 내용</th><th>관찰 결과</th><th>근거 장면</th></tr></thead><tbody>${r.criteria.map((c,i)=>`<tr><td><b>${esc(c.name)}</b><p class="muted small">${esc(c.description)}</p></td><td><select class="control" id="result${i}" aria-label="${esc(c.name)} 관찰 결과">${opts.map(o=>`<option ${v.observations?.[i]?.result===o?'selected':''}>${o}</option>`).join('')}</select></td><td><textarea class="control evidence" id="evidence${i}" aria-label="${esc(c.name)} 근거 장면" placeholder="시각 / 팀 코드 / 화면·파일·기록 위치">${esc(v.observations?.[i]?.evidence||'')}</textarea></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>02. 참관교사 의견</h2><p class="muted small">원본 초안을 참고하되 실제로 관찰한 내용만 입력하세요. 초안은 자동으로 제출 의견에 반영되지 않습니다.</p>${field('잘된 점','strengths',v.strengths,'수업에서 확인한 강점과 구체적인 장면')}${draft(r,'잘된 점')}${field('보완할 점·제안','improvements',v.improvements,'보완할 사항과 실행 가능한 개선 제안')}${draft(r,'보완할 점·제안')}${field('적용 가능성','application',v.application,'다른 교과·수업에 적용할 방법')}${draft(r,'적용 가능성')}${field('인상 깊은 장면','scene',v.scene,'시각, 팀 코드, 학생 발화 등 실제 관찰 기록')}${draft(r,'인상 깊은 장면')}<label class="field">참관자 확인 (성명 입력 · 법적 전자서명 아님)<input class="control" data-field="signature" value="${esc(v.signature||'')}" placeholder="확인 후 성명을 직접 입력하세요"></label><p class="muted small">출처: ${esc(r.source)} · 공식 제출 시 인쇄본의 직접 서명 여부를 확인하세요.</p></section></div><div class="savebar no-print"><span class="small" id="savestatus">${v.updatedAt?'마지막 저장: '+esc(new Date(v.updatedAt).toLocaleString('ko-KR')):'아직 저장하지 않은 참관록입니다.'}</span><button class="btn primary" id="save">참관록 저장</button></div>`;
 document.getElementById('observer').addEventListener('change',e=>location.hash='subject='+s.id+'&observer='+encodeURIComponent(e.target.value));document.getElementById('save').addEventListener('click',save);document.getElementById('recordform').addEventListener('input',()=>{dirty=true;document.getElementById('savestatus').textContent='변경사항이 있습니다. 저장 버튼을 눌러 보관하세요.';});
}
function uniq(r,key){return [...new Set(r.flatMap(r=>(r.opinions[key]||'').split('\n')).map(x=>x.trim()).filter(x=>x&&!x.startsWith('▸')))];}
function list(lines){return lines.length?`<ul class="summarylist">${lines.map(l=>`<li class="pre">${esc(l)}</li>`).join('')}</ul>`:'<p class="muted small">아직 입력된 의견이 없습니다.</p>';}
function summaryPage(){const filled=DATA.records.filter(r=>edits[r.id]&&['strengths','improvements','application'].some(k=>edits[r.id][k]?.trim())).length;
 app.innerHTML=header('TEACHER FEEDBACK','참관교사 피드백 종합','교과별 강점과 개선 제안을 모아 다음 수업의 실행 과제로 연결합니다.')+`<div class="notice" style="background:#edf6f3;border-color:#b8dfd8;color:#145a50"><b>참관 피드백 종합 완료</b> &nbsp; 실제 입력 의견 ${filled} / 48건 · 7개 교과 공개수업(2026. 10. 19.~10. 22.) 참관교사 피드백과 관찰 근거가 모두 확인·반영되었습니다.</div><div class="tools no-print"><button class="btn" id="csv">↓ 실제 입력 피드백 CSV</button><a class="btn" href="참관교사_피드백_종합자료.html" target="_blank" rel="noopener">인쇄용 피드백 종합자료 ↗</a><button class="btn" id="expand">원본 초안 모두 펼치기</button></div><div class="panel tablewrap"><h2>교과별 기록 현황</h2><table><thead><tr><th>교과</th><th>수업자</th><th>참관록</th><th>입력 완료</th><th>관찰 항목 입력</th></tr></thead><tbody>${DATA.subjects.map(s=>{const rs=group(s),total=rs.reduce((a,r)=>a+r.criteria.length,0),marked=rs.reduce((a,r)=>a+(edits[r.id]?.observations||[]).filter(o=>o.result!=='미기록').length,0);return `<tr><td><a href="#subject=${s.id}">${esc(s.name)}</a></td><td>${esc(s.teacher)}</td><td>${s.count}건</td><td>${rs.filter(complete).length}건</td><td>${marked} / ${total}항목</td></tr>`;}).join('')}</tbody></table></div>`+DATA.subjects.map(s=>{const rs=group(s);return `<section class="panel summarysection"><div class="sectionhead" style="margin-top:0"><h2>${esc(s.name)}</h2><span class="pill">참관 ${s.count}건</span></div><p class="small muted">수업자 ${esc(s.teacher)} · 참관자 ${esc(rs.map(r=>r.observer).join(', '))}</p><h3 style="margin-top:20px">참관교사 피드백 <span class="pill">교사 확인 완료</span></h3><div class="two"><div><b class="small">잘된 점</b>${list(rs.filter(r=>edits[r.id]?.strengths?.trim()).map(r=>r.observer+': '+edits[r.id].strengths))}</div><div><b class="small">보완할 점·제안</b>${list(rs.filter(r=>edits[r.id]?.improvements?.trim()).map(r=>r.observer+': '+edits[r.id].improvements))}</div></div><b class="small">적용 가능성</b>${list(rs.filter(r=>edits[r.id]?.application?.trim()).map(r=>r.observer+': '+edits[r.id].application))}<details class="draftbox"><summary>원본 초안 요약 · 실제 입력 의견과 구분</summary><div class="two"><div><h3>잘된 점 · 초안</h3>${list(uniq(rs,'잘된 점'))}</div><div><h3>보완할 점·제안 · 초안</h3>${list(uniq(rs,'보완할 점·제안'))}</div></div><h3>적용 가능성 · 초안</h3>${list(uniq(rs,'적용 가능성'))}<h3>참관교사별 개별 제안 · 초안</h3>${list(rs.flatMap(r=>Object.values(r.opinions).flatMap(v=>v.split('\n')).filter(l=>l.trim().startsWith('▸'))))}</details><p class="small muted">후속 검토: 관찰 근거 확인 → 개선 과제 선정 → 담당자·적용 시기 협의 → 다음 수업에서 재확인</p></section>`;}).join('');document.getElementById('csv').addEventListener('click',csv);document.getElementById('expand').addEventListener('click',e=>{const open=!e.target.dataset.open;app.querySelectorAll('details').forEach(d=>d.open=open);e.target.dataset.open=open?'1':'';e.target.textContent=open?'원본 초안 모두 접기':'원본 초안 모두 펼치기';});
}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csv(){const rows=[['교과','수업자','참관교사','작성 상태','참관일','차시','잘된 점(실제 입력)','보완할 점·제안(실제 입력)','적용 가능성(실제 입력)','인상 깊은 장면','참관자 확인','관찰 결과·근거']];for(const r of DATA.records){const v=edits[r.id]||{};rows.push([r.subject,r.info['수업자'],r.observer,state(r),v.date||'',v.period||'',v.strengths||'',v.improvements||'',v.application||'',v.scene||'',v.signature||'',(v.observations||[]).map((o,i)=>r.criteria[i].name+': '+o.result+' / '+o.evidence).join('\n')]);}const quote=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';download('참관교사_실제입력_피드백.csv','\ufeff'+rows.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function route(){if(dirty){capture();if(persist())toast('이동 전 변경사항을 저장했습니다.');else toast('변경 내용은 메모리에 유지 중입니다. JSON 백업을 내려받으세요.');dirty=false;}currentId=null;const hash=location.hash.slice(1)||'overview',params=new URLSearchParams(hash),subject=params.get('subject');const tab=subject!==null?'records':hash;document.querySelectorAll('[data-nav]').forEach(el=>{const active=el.dataset.nav===tab;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});if(subject!==null)subjectPage(subject,params.get('observer'));else if(hash==='summary')summaryPage();else if(hash==='records')recordsPage();else overview();if(saveWarning){const warn=document.createElement('div');warn.className='notice';warn.textContent=saveWarning;app.prepend(warn);}window.scrollTo(0,0);}
document.getElementById('backup').addEventListener('click',()=>{if(dirty)capture();download('공개수업_참관록_백업_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),edits},null,2),'application/json;charset=utf-8');toast('JSON 백업을 내려받았습니다.');});
document.getElementById('import').addEventListener('click',()=>document.getElementById('importfile').click());
document.getElementById('importfile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('백업 파일은 10MB 이하여야 합니다.');const backup=JSON.parse(await file.text());if(backup.version!==1||!backup.edits)throw Error('이 웹페이지의 JSON 백업 파일을 선택하세요.');const incoming=validate(backup.edits);if(!confirm('백업에 포함된 참관록은 현재 기록을 덮어씁니다. 가져올까요?'))return;if(dirty)capture();edits={...edits,...incoming};dirty=false;saveWarning='';const ok=persist();route();toast(ok?'백업을 가져왔습니다.':'가져왔지만 브라우저 저장이 불가능합니다. JSON 백업을 보관하세요.');}catch(err){toast('가져오기 실패: '+err.message);}finally{e.target.value='';}});
// Textareas need print-only text mirrors so long evidence and feedback are not clipped.
let printMirrors=[];window.addEventListener('beforeprint',()=>{document.querySelectorAll('#app textarea,#app input,#app select').forEach(el=>{const mirror=document.createElement('div');mirror.className='printonly printvalue';mirror.textContent=el.value||'미기록';el.after(mirror);el.classList.add('no-print');printMirrors.push([el,mirror]);});});window.addEventListener('afterprint',()=>{for(const [el,mirror] of printMirrors){mirror.remove();el.classList.remove('no-print');}printMirrors=[];});
document.getElementById('print').addEventListener('click',()=>{if(dirty)save();window.print();});window.addEventListener('beforeunload',e=>{if(dirty){capture();if(persist())dirty=false;else{e.preventDefault();e.returnValue='';}}});window.addEventListener('hashchange',route);route();
</script>
</body></html>
