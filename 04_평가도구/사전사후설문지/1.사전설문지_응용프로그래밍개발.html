<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사전 설문</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#1c3346;font:18px/1.75 "Malgun Gothic",sans-serif}main{max-width:1080px;margin:auto;padding:28px}header{background:#183f58;color:white;padding:32px;border-radius:14px}h1{font-size:31px}h2{font-size:25px;color:#165977}section{padding:30px;background:white;border-radius:12px;margin:20px 0;border:1px solid #cad7e0}table{width:100%;border-collapse:collapse;margin:15px 0}td,th{border:1px solid #a9bcc9;padding:10px;text-align:left;vertical-align:top}th{background:#edf4f8}button{background:#17607d;color:white;border:0;border-radius:6px;padding:11px 17px;font:inherit;cursor:pointer;margin:8px 5px 8px 0}input,select,textarea{font:inherit;padding:8px;border:1px solid #8dabbc;border-radius:4px;max-width:100%}textarea{width:100%;min-height:100px}.note{background:#edf5f7;padding:15px;border-left:4px solid #3a8d94}.small{font-size:14px;color:#4c6574}.q{margin:22px 0;padding-bottom:16px;border-bottom:1px solid #dce4eb}.scale{display:flex;gap:14px;flex-wrap:wrap}.scale label{font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4f7;padding:16px}.error{color:#bd2424}@media print{body{background:white}main{max-width:none;padding:0}section{break-inside:avoid}button{display:none}header{background:white;color:#183f58}.slide{page-break-before:always;min-height:240mm}}</style><main><header><h1>사전 설문</h1><p>응용프로그래밍개발 · 김0훈·김0주 공동 지도</p></header><section><p>응답은 수업 지원과 개선에 활용하며 성적에 반영하지 않습니다. 이름·접속 코드·비밀번호 대신 교사가 안내한 학생 내부 코드를 사용하세요.</p><form id="survey"><label>학생 내부 코드 <input required name="student" pattern="[A-Za-z0-9_-]{1,24}" maxlength="24"></label> <label>팀 번호 <input required name="team" maxlength="12"></label> <label>실제 응답일 <input required type="date" name="date"></label><h2>1. 문제 해결과 챗봇 활용</h2><p>1 전혀 그렇지 않다 · 2 그렇지 않다 · 3 보통이다 · 4 그렇다 · 5 매우 그렇다</p><div id="common"></div><h2>2. 응용프로그래밍개발</h2><div id="subject"></div><h2>3. 개념 확인</h2><div id="concepts"></div><h2>4. 서술 응답</h2><label><p>이번 수업에서 가장 궁금한 점은 무엇입니까?</p><textarea required name="open0"></textarea></label><label><p>기능이 기대와 다를 때 무엇을 어떤 순서로 확인하겠습니까?</p><textarea required name="open1"></textarea></label><label><p>챗봇이나 선생님에게 어떤 도움을 받고 싶습니까?</p><textarea required name="open2"></textarea></label><button type="submit">작성 확인·응답 파일 저장</button><button type="button" onclick="print()">인쇄</button><p id="done" role="status"></p></form><p class="small">파일은 이 기기에 저장됩니다. 교사가 안내한 방법으로 제출하세요. 이 화면에서는 서버로 전송하지 않습니다.</p></section></main><script>const COMMON=["챗봇의 제안이 우리 팀의 문제 조건에 맞는지 확인할 수 있다.", "목적·현재 상황·조건·시도를 구분하여 질문할 수 있다.", "답변의 제안과 직접 관찰한 결과를 구분할 수 있다.", "기능이 예상과 다르게 동작하는 상황을 다른 사람에게 설명할 수 있다.", "기록을 근거로 추가로 확인할 조건을 찾을 수 있다.", "조건을 하나씩 바꾸어 결과를 비교할 수 있다.", "내 과목의 활동이 자동차 공동 제작에서 어떤 도움을 주는지 설명할 수 있다.", "다른 사람이 다시 확인할 수 있도록 조건·절차·결과를 기록할 수 있다.", "요구 확인에서 동작 확인까지의 순서를 설명할 수 있다.", "응용프로그램의 기능 확인이 실제 현장에서 왜 필요한지 설명할 수 있다.", "챗봇이 되물으면 빠진 조건과 시도를 추가로 설명할 수 있다.", "대화나 첨부 파일에서 비밀번호·개인정보를 제외할 수 있다.", "챗봇이 알려 준 방법은 이해하지 못해도 그대로 사용해도 된다고 생각한다."];const SUBJECT=["사용자의 요구를 기능 명세의 입력·처리·결과와 연결할 수 있다.", "질문 입력부터 저장된 대화 조회까지 자료 흐름을 설명할 수 있다.", "기존 JSP·Oracle 수업과 현재 챗봇의 공통 처리 개념을 설명할 수 있다.", "팀과 대화를 구분하여 조회할 자료를 찾을 수 있다.", "입력하지 않음과 공백 입력을 시험 조건으로 정할 수 있다.", "기대 결과를 먼저 정하고 관찰 결과와 비교할 수 있다.", "시험 결과의 일치·불일치·미실행을 구분하여 기록할 수 있다."];const CONCEPTS=[{"question": "팀 A의 대화 X를 열었는데 화면이 비어 있습니다. 가장 먼저 할 확인으로 알맞은 것은 무엇입니까?", "options": ["정렬 기능이 없어서라고 단정하고 정렬만 추가한다.", "팀과 대화 선택, 저장된 내용 유무, 화면에 받은 결과를 차례로 대조한다.", "다른 팀의 대화를 열어 내용을 가져온다.", "챗봇 답변을 받았으므로 해결 완료로 기록한다."], "answer": 1}, {"question": "팀 코드를 입력하지 않은 경우와 공백만 입력한 경우를 확인하려고 합니다. 적절한 확인 방법은 무엇입니까?", "options": ["두 경우의 입력 조건과 기대 결과를 먼저 적고, 한 경우씩 실행하여 화면 안내와 시작 여부를 기록한다.", "챗봇에게 물어보고 답변을 받으면 두 경우 모두 정상으로 기록한다.", "공백은 언제나 올바른 팀 코드라고 보고 바로 다음 단계로 간다.", "두 경우를 한꺼번에 바꾼 뒤 원래 조건을 적지 않는다."], "answer": 0}];const PHASE="pre";
 const $=id=>document.getElementById(id);function scale(q,id,prefix,na=false){$(id).innerHTML=q.map((s,i)=>`<div class="q"><p>${i+1}. ${s}</p><div class="scale">${[1,2,3,4,5].map(n=>`<label><input required type="radio" name="${prefix}${i}" value="${n}"> ${n}</label>`).join('')}${na?`<label><input required type="radio" name="${prefix}${i}" value="NA"> 해당 없음</label>`:''}</div></div>`).join('')};scale(COMMON,'common','c');scale(SUBJECT,'subject','s');$('concepts').innerHTML=CONCEPTS.map((q,i)=>`<div class="q"><p>${i+1}. ${q.question}</p>${q.options.map((s,j)=>`<p><label><input required type="radio" name="k${i}" value="${j}"> ${s}</label></p>`).join('')}</div>`).join('');if(PHASE==='post')scale(['사전에 궁금했던 점이 해소되었다.','사전에 필요했던 도움을 받았다.'],'resolution','r',true);
 $('survey').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));const row={instrument:'appdev-functions-v2',phase:PHASE,student:d.student,team:d.team,date:d.date,common:COMMON.map((_,i)=>+d['c'+i]),subject:SUBJECT.map((_,i)=>+d['s'+i]),concepts:CONCEPTS.map((_,i)=>+d['k'+i]),open:[d.open0,d.open1,d.open2],resolution:PHASE==='post'?[d.r0==='NA'?null:+d.r0,d.r1==='NA'?null:+d.r1]:null};const u=URL.createObjectURL(new Blob([JSON.stringify(row,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='appdev_v2_'+PHASE+'_'+d.student+'_'+d.date+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('done').textContent='파일을 저장했습니다. 교사가 안내한 방법으로 제출하세요.';};</script></html>
